[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitline"
version = "0.1.0"
description = "Shopping concierge that assembles one package and checks it in code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.6",
    "pydantic-settings>=2.4",
    "strands-agents>=1.64,<2",
    "boto3>=1.35",
]

[project.optional-dependencies]
stores = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "opensearch-py>=2.7",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "moto[dynamodb]>=5.0",
]

[project.scripts]
kitline = "kitline.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
